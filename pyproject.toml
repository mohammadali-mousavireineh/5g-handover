[project]
name = "enhanced-5g-handover-prediction"
version = "1.1.0"
description = "Code, processed data, and manuscript source for enhanced 5G handover prediction over real-network RSRP traces."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mohammadali Mousavireineh", email = "mousavireineh@gmail.com"}, {name = "Astra Mousavireineh"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "imbalanced-learn>=0.10",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
training = ["tensorflow>=2.12", "keras>=2.12"]

[project.scripts]
handover-compare = "handover_compare.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
