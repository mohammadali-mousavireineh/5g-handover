name: smoke-test

on:
  push:
  pull_request:

jobs:
  import-and-data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import package and load processed datasets
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from handover_compare.data import load_feature_base
          root = Path.cwd()
          for name in ['anatel_concatbases.csv','anatel_concatbases_gru.csv','anatel_concatbases_tcn.csv']:
              X, y, _ = load_feature_base(root / 'data' / 'processed' / name)
              assert X.shape[0] == y.shape[0]
              assert X.shape[1] == 50
              assert set(y).issubset({0, 1})
              print(name, X.shape, y.mean())
          PY
